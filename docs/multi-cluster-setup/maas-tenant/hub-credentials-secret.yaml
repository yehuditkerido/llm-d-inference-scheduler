# Secret containing Hub tenant SA token
# This token is used by ExternalModel to authenticate to Hub MaaS
# The token identifies this tenant for Hub-level rate limiting
#
# To generate the token on Hub cluster:
#   oc create token tenant-consumer-sa -n tenants --duration=8760h > token.txt
#
# Then create this secret on Tenant cluster:
#   kubectl create secret generic hub-tenant-sa-token \
#     --from-file=api-key=token.txt \
#     -n models-as-a-service
apiVersion: v1
kind: Secret
metadata:
  name: hub-tenant-sa-token
  namespace: models-as-a-service
type: Opaque
stringData:
  # Replace with actual token from Hub's tenant-consumer-sa
  api-key: "<REPLACE_WITH_HUB_SA_TOKEN>"
