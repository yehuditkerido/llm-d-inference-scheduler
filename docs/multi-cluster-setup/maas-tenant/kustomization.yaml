apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tenant cluster MaaS resources
# User/Team level authentication and rate limiting

resources:
  # Test identities (Service Accounts simulating users/teams)
  - service-accounts.yaml
  
  # Hub API key for cross-cluster authentication
  - hub-credentials-secret.yaml
  
  # ExternalModel pointing to Hub MaaS
  - external-model.yaml
  
  # Register model with MaaS
  - maas-model-ref.yaml
  
  # Authentication policy
  - maas-auth-policy.yaml
  
  # User/Team subscriptions (rate limits)
  - maas-subscription.yaml

# Apply these AFTER MaaS reconciles (manual step):
# - httproute-override.yaml (injects Hub API key)
# - destination-rule.yaml (TLS configuration)
