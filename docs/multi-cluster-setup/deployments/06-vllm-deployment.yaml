# vLLM Deployment with TinyLlama model
# 1 replica — each spoke has 2 GPUs; the second GPU runs another model
# (see 07-vllm-smollm-spoke1.yaml / 08-vllm-qwen-spoke2.yaml).
#
# Prerequisites:
#   1. GPU Operator installed with driver 570.211.01
#   2. ServiceAccount vllm-sa created with anyuid SCC:
#      oc adm policy add-scc-to-user anyuid -z vllm-sa -n llm-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-tinyllama
  namespace: llm-inference
  labels:
    app: vllm-tinyllama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-tinyllama
  template:
    metadata:
      labels:
        app: vllm-tinyllama
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vllm-sa
      securityContext:
        runAsUser: 0
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args:
            - "--model"
            - "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--dtype"
            - "half"
            - "--max-model-len"
            - "2048"
            - "--tensor-parallel-size"
            - "1"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
              memory: "8Gi"
              cpu: "2"
          env:
            - name: HOME
              value: "/tmp"
            - name: HF_HOME
              value: "/tmp/huggingface"
            - name: TORCHINDUCTOR_CACHE_DIR
              value: "/tmp/torchinductor_cache"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          volumeMounts:
            - name: tmp-cache
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp-cache
          emptyDir:
            sizeLimit: 20Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-tinyllama
  namespace: llm-inference
  labels:
    app: vllm-tinyllama
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: vllm-tinyllama
