# Hub EPP Deployment
# Deploy on: Hub cluster (aigrid-hub)
# Uses file-discovery to find Spoke EPPs
---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: epp
  namespace: llm-d-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-endpoints
  namespace: llm-d-system
data:
  endpoints.yaml: |
    # Spoke Envoy gateways - single entry point for both metrics and inference
    # /metrics → Spoke EPP aggregated metrics
    # /v1/*    → Spoke EPP routing → vLLM pods
    endpoints:
      - name: spoke-tenant1
        address: inference-gateway-llm-d-system.apps.aigrid-tenant1.aigriddev.sysdeseng.com
        port: "443"
        labels:
          region: us-east-2
          cluster: spoke-tenant1
      - name: spoke-tenant2
        address: inference-gateway-llm-d-system.apps.aigrid-tenant2.aigriddev.sysdeseng.com
        port: "443"
        labels:
          region: us-west-2
          cluster: spoke-tenant2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config
  namespace: llm-d-system
data:
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - name: file-discovery
        type: file-discovery
        parameters:
          path: /etc/epp/endpoints.yaml
      - name: metrics-data-source
        type: metrics-data-source
        parameters:
          scheme: https
          insecureSkipVerify: true
      - name: core-metrics-extractor
        type: core-metrics-extractor
      - name: queue-scorer
        type: queue-scorer
      - name: kv-cache-utilization-scorer
        type: kv-cache-utilization-scorer
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
    dataLayer:
      discovery:
        pluginRef: file-discovery
      sources:
        - pluginRef: metrics-data-source
          extractors:
            - pluginRef: core-metrics-extractor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp
  namespace: llm-d-system
  labels:
    app: epp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epp
  template:
    metadata:
      labels:
        app: epp
    spec:
      serviceAccountName: epp
      containers:
      - name: epp
        image: ghcr.io/yehuditkerido/llm-d-router-endpoint-picker:multi-cluster-test
        imagePullPolicy: Always
        args:
        - --config-file=/etc/epp-config/config.yaml
        - --pool-name=hub-pool
        - --pool-namespace=llm-d-system
        - --metrics-port=9002
        - --grpc-port=9001
        - --secure-serving=false
        - --metrics-endpoint-auth=false
        - --health-checking=true
        - -v=4
        ports:
        - name: metrics
          containerPort: 9002
          protocol: TCP
        - name: grpc
          containerPort: 9001
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: endpoints
          mountPath: /etc/epp
          readOnly: true
        - name: config
          mountPath: /etc/epp-config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          grpc:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: endpoints
        configMap:
          name: cluster-endpoints
      - name: config
        configMap:
          name: epp-config
---
apiVersion: v1
kind: Service
metadata:
  name: epp
  namespace: llm-d-system
  labels:
    app: epp
spec:
  selector:
    app: epp
  ports:
  - name: metrics
    port: 9002
    targetPort: 9002
    protocol: TCP
  - name: grpc
    port: 9001
    targetPort: 9001
    protocol: TCP
  type: ClusterIP
