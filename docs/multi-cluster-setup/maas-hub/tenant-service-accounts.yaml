# Service Accounts for tenant clusters
# Each tenant cluster gets a SA to authenticate with Hub MaaS
# The SA token is used by the tenant's ExternalModel credentialRef

---
# Namespace for tenant SAs
apiVersion: v1
kind: Namespace
metadata:
  name: tenants
---
# SA for aigrid-consumer tenant cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-consumer-sa
  namespace: tenants
