# This Route was created via CLI with Let's Encrypt certificate:
#   oc create route edge maas-hub-gateway \
#     --service=envoy \
#     --port=http \
#     --hostname=maas-hub.apps.aigrid-hub.aigriddev.sysdeseng.com \
#     --cert=/tmp/maas-hub-tls.crt \
#     --key=/tmp/maas-hub-tls.key \
#     -n llm-d-system
#
# The certificate comes from the maas-hub-gateway-tls Secret
# (created by cert-manager via inference-certificate.yaml)
#
# To recreate:
#   1. Apply letsencrypt-issuer.yaml (ClusterIssuer)
#   2. Apply inference-certificate.yaml (Certificate)
#   3. Wait for cert to be Ready
#   4. Extract cert/key from Secret and create Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-hub-gateway
  namespace: llm-d-system
spec:
  host: maas-hub.apps.aigrid-hub.aigriddev.sysdeseng.com
  to:
    kind: Service
    name: envoy
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    # certificate and key are embedded from Let's Encrypt (not shown here)
