# Secrets containing API keys for each Spoke's MaaS
# These keys are generated by each Spoke's MaaS and allow Hub to authenticate
# Label ipp-managed=true is required for IPP to watch these secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke1-maas-credentials
  namespace: llm-d-system
  labels:
    ipp-managed: "true"
type: Opaque
stringData:
  api-key: "REPLACE_WITH_SPOKE1_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke2-maas-credentials
  namespace: llm-d-system
  labels:
    ipp-managed: "true"
type: Opaque
stringData:
  api-key: "REPLACE_WITH_SPOKE2_API_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke3-maas-credentials
  namespace: llm-d-system
  labels:
    ipp-managed: "true"
type: Opaque
stringData:
  api-key: "REPLACE_WITH_SPOKE3_API_KEY"
