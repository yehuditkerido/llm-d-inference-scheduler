---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hub-post
  namespace: llm-d-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-post-config
  namespace: llm-d-system
data:
  config.yaml: |
    plugins:
      - type: model-provider-resolver
        name: model-provider-resolver
        parameters:
          hubMode: true
      - type: apikey-injection
        name: apikey-injection
    profiles:
      - name: default
        plugins:
          request:
            - pluginRef: model-provider-resolver
            - pluginRef: apikey-injection
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-post
  namespace: llm-d-system
  labels:
    app: hub-post
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hub-post
  template:
    metadata:
      labels:
        app: hub-post
    spec:
      serviceAccountName: hub-post
      securityContext:
        runAsNonRoot: true
      containers:
        - name: hub-post
          image: ghcr.io/yehuditkerido/ai-gateway-payload-processing:hub-mode
          imagePullPolicy: Always
          args:
            - --config-file=/config/config.yaml
            - --v=3
            - --tracing=false
            - --secure-serving=false
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          ports:
            - containerPort: 9004
              name: grpc
              protocol: TCP
            - containerPort: 9005
              name: health
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: hub-post-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: hub-post
  namespace: llm-d-system
  labels:
    app: hub-post
spec:
  selector:
    app: hub-post
  ports:
    - name: grpc
      port: 9004
      targetPort: grpc
      protocol: TCP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-post-crds
rules:
  - apiGroups: ["inference.opendatahub.io"]
    resources: ["externalmodels", "externalproviders"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["maas.opendatahub.io"]
    resources: ["externalmodels"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-post-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-post-crds
subjects:
  - kind: ServiceAccount
    name: hub-post
    namespace: llm-d-system
